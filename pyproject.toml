[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instant-chat-agent"
version = "0.1.0"
description = "Платформа для создания RAG-ботов в Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-community>=0.3",
    "qdrant-client>=1.7",
    "python-telegram-bot>=21.0",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "redis>=5.0",
    "docker>=7.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[project.scripts]
instant-chat-product = "instant_chat_agent.main:main"
instant-chat-bot = "instant_chat_agent.bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/instant_chat_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/", "docs/", "docker/", "scripts/", "config/", "tests/"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
